workflows:
  totv-final-fix:
    name: ToTV+ Ultimate Success
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      # إجبار النظام على استخدام نسخة حديثة تتخطى خطأ filePermissions
      flutter: 3.24.0 
      java: 17
    scripts:
      - name: Hard Cleanup
        script: | 
          # مسح ذاكرة الكاش تماماً
          flutter clean
          flutter pub get
          cd android
          # إجبار الأندرويد على استخدام نسخة Kotlin التي وضعناها في build.gradle
          ./gradlew clean
          cd ..
      - name: Build Android Release APK
        script: | 
          # السر هنا: بناء النسخة النهائية (Release) يتخطى فحص ملفات المطورين التي تسبب الفشل
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
