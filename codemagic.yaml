workflows:
  android-workflow:
    name: Shof TV Android Build
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      java: 17
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get Flutter packages
        script: | 
          flutter pub get
      - name: Build Android APK
        script: | 
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/**/app-release.apk
    publishing:
      email:
        recipients:
          - YOUR_EMAIL_HERE # ضع إيميلك هنا لتصلك النسخة عليه
