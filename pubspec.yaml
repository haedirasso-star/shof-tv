name: shof_tv
description: A new Flutter project for movies and live tv.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # مكتبات الاتصال وجلب البيانات ومعالجتها
  http: ^1.1.0
  intl: ^0.19.0
  
  # مكتبات تشغيل الفيديو والبث المباشر (IPTV)
  video_player: ^2.8.1
  chewie: ^1.7.5
  
  # مكتبة تشغيل سيرفرات المشاهدة العالمية (Embed)
  webview_flutter: ^4.4.2

  # مكتبات الواجهة والسلايدر والصور
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.0
  
  # مكتبة فتح الروابط الخارجية (مثل التلجرام)
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # إذا كان لديك أي صور محلية (لوجو التطبيق مثلاً) أضفها هنا
  # assets:
  #   - assets/images/
