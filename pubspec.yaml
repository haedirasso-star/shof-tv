name: shof_tv
description: "تطبيق Shof TV لمشاهدة القنوات العراقية والرياضية والأفلام"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # مكتبات الاتصال وجلب البيانات ومعالجتها
  http: ^1.1.0
  intl: ^0.19.0
  
  # مكتبات تشغيل الفيديو والبث المباشر (IPTV)
  video_player: ^2.8.1
  chewie: ^1.7.5
  
  # مكتبة تشغيل سيرفرات المشاهدة العالمية والأفلام (Embed)
  webview_flutter: ^4.4.2

  # مكتبات الواجهة والسلايدر والصور
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.0
  
  # مكتبة فتح الروابط الخارجية (مثل التلجرام والدعم الفني)
  url_launcher: ^6.2.1

  # إضافة مكتبة للتحقق من الاتصال بالإنترنت (مهمة لتطبيقات الـ IPTV)
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # تفعيل مجلد الصور (تأكد من إنشاء المجلد في مشروعك ووضع اللوجو فيه)
  assets:
    - assets/images/
    # إذا كان لديك أيقونة خاصة بالتطبيق، يفضل وضعها هنا
    # - assets/icons/
