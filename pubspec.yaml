name: shof_tv
description: "تطبيق Shof TV لمشاهدة القنوات العراقية والرياضية والأفلام"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # مكتبات الاتصال وجلب البيانات
  http: ^1.1.0
  intl: ^0.19.0
  
  # مكتبات تشغيل الفيديو والبث المباشر (IPTV)
  video_player: ^2.8.1
  chewie: ^1.7.5
  
  # التحكم بالسطوع
  screen_brightness: ^1.0.1

  # مكتبة تشغيل سيرفرات المشاهدة العالمية والأفلام (Embed)
  webview_flutter: ^4.4.2

  # مكتبات الواجهة والسلايدر والصور
  carousel_slider: ^5.0.0
  cached_network_image: ^3.3.0
  
  # مكتبة فتح الروابط الخارجية (مثل التلجرام)
  url_launcher: ^6.2.1

  # التحقق من الاتصال بالإنترنت
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

# إعدادات أيقونة التطبيق
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  # تفعيل مجلد الصور (مهم جداً)
  assets:
    - assets/images/
